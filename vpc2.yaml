AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for VPC2'

Resources:
  MyVPC2:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: '173.16.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: 'Name'
          Value: 'MyVPC2'

PublicSubnet1A:
  Type: 'AWS::EC2::Subnet'
  Properties:
    VpcId: !Ref MyVPC
    CidrBlock: '173.16.1.0/24'
    AvailabilityZone: :Select [0, !GetAZs '']
    MapPublicIpOnLaunch: true
    Tags:
      - Key: 'Name'
        Value: 'PublicSubnet1A'

AppPrivateSubnet1A:
  Type: 'AWS::EC2::Subnet'
  Properties:
    VpcId: !Ref MyVPC2
    CidrBlock: '173.16.2.0/24'
    AvailabilityZone: !Select [0, !GetAZs '']
    MapPublicIpOnLaunch: false
    Tags:
      - Key: 'Name'
        Value: 'AppPrivateSubnet1A'
    
DataPrivateSubnet1A:
  Type: 'AWS::EC2::Subnet'
  Properties:
    VpcId: !Ref MyVPC2
    CidrBlock: '173.16.3.0/24'
    AvailabilityZone: !Select [0, !GetAZs '']
    MapPublicIpOnLaunch: false
    Tags:
      - Key: Name
        Value: 'DataPrivateSubnet1'